## DEFAULT SETTINGS ARE NOT MEANT TO BE TAKEN STRAIGHT INTO PRODUCTION
## see https://www.rabbitmq.com/configure.html for further information
## on configuring RabbitMQ
management.load_definitions = /etc/rabbitmq/definitions.json

## Restrict the default guest user to loopback connections only (the secure
## default). The application authenticates as the dedicated "trades" user, so
## guest never needs remote access.
## https://www.rabbitmq.com/access-control.html#loopback-users
## https://www.rabbitmq.com/production-checklist.html#users
loopback_users.guest = true

## Send all logs to stdout/TTY. Necessary to see logs when running via
## a container
log.console = true

# makes classic queues use a more efficient message storage
# and queue index implementations
classic_queue.default_version = 2
